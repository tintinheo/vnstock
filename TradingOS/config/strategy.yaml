# TradingOS Alpha — Strategy Configuration v1.1
# Canonical source-of-truth for all thresholds (SRS §9.4)
# All prose sections reference these values; do not hardcode elsewhere.

# ── MFPM Scoring ─────────────────────────────────────────────────────────────
mfpm:
  # Gate thresholds in compute_mfpm() Layer 2:
  min_score_strong_buy: 70   # mfpm_score >= this (+ AMF PASS + MC >= mc_min_prob_buy) → BUY
  min_score_watch:      50   # min_score_buy in YAML was previously semantically wrong;
                             # this key is the WATCH gate (mfpm_score >= 50 → WATCH)
  mode_a_weight:        1.0
  mode_b_weight:        1.0
  mode_w_sms_gate:      65   # Stricter VN filter: require clearer whale-flow quality before Mode W can assist BUY paths
  mc_min_prob_buy:      0.55 # Min Monte-Carlo win probability for BUY
  mc_min_prob_strong:   0.60 # Min MC for STRONG_BUY
  # [VN-FIX O4] 500 sims achieves equivalent decision stability for daily re-evaluation
  mc_n_sim:             500  # Monte Carlo simulation count (was 2000)
  # [VN-FIX V1] Volume confirmation for Mode A — VN "nến xanh" requires ≥1.5× avg volume
  mode_a_vol_confirm:   1.5  # multiplier vs 20-day avg volume (was 0.8)

  # [P4.1] SMS composite bonus ladder (applied to Mode A/B base score)
  # These defaults reproduce the previously hardcoded values exactly.
  sms_bonus_strong:    20   # sms_raw >= 75
  sms_bonus_moderate:  12   # sms_raw >= 60
  sms_bonus_weak:       5   # sms_raw >= 40
  sms_penalty_low:    -10   # sms_raw <  20
  sms_penalty_mcvd:   -25   # mcvd_vs_price == DIVERGE_BEARISH (overrides other SMS bonus)

  # [P4.2] Foreign net-flow bonus ladder (net/ADTV fraction)
  # Defaults reproduce the previously hardcoded values exactly.
  foreign_bonus_strong:    8   # foreign_net_pct >  0.30
  foreign_bonus_moderate:  4   # foreign_net_pct >  0.15
  foreign_penalty_strong: -8   # foreign_net_pct < -0.30
  foreign_penalty_moderate: -4 # foreign_net_pct < -0.15

  # [P4.3] BiLSTM directional bonus ladder (signal=UP/DOWN × confidence=HIGH/MEDIUM)
  # Defaults reproduce the previously hardcoded values exactly.
  bilstm_bonus_up_high:      10
  bilstm_bonus_up_medium:     5
  bilstm_penalty_down_high:  -10
  bilstm_penalty_down_medium: -5

# ── Horizon Forecast Weights ─────────────────────────────────────────────────
# [VN-FIX V2] VN is a T+2.5 settlement market — retail traders hold 1–5 sessions.
# Short-term forecast should carry more weight than long-term.
horizon_forecast:
  weight_short: 0.50   # was 0.40 — VN T+2.5 dominance
  weight_mid:   0.30   # was 0.35
  weight_long:  0.20   # was 0.25

# ── Mode W Thresholds (ModeW_score) ─────────────────────────────────────────
mode_w:
  strong_buy_score:    95     # ModeW_score >= 95 AND AMF=PASS AND MC>=0.60
  buy_score:           80     # 80-94
  watch_score:         60     # 60-79
  sms_raw_gate:        65     # Keep Mode W aligned with stricter MFPM gate to reduce proxy-flow false positives

# ── Anti-Manipulation Filter ──────────────────────────────────────────────────
amf:
  open_spike_threshold:  0.09  # [BUG-4 FIX] → 9%: HOSE circuit breaker ±7%; 6% is normal news-day gap
  wash_sale_volume_mult: 3.0   # Volume > 3× avg → suspect
  bid_ask_imbalance:     0.70  # > 70% one-sided order book
  vwap_deviation:        0.05  # [BUG-4 FIX] → 5%: 3% triggered too often for normal VN volatility
  # [P4.4] Weighted flag severity — prevents mild flags from triggering BLOCK.
  # Each flag type has a severity weight; decision uses weighted sum not raw count.
  flag_weights:
    OPEN_SPIKE:            2.0  # extreme gap — likely manipulation
    WASH_SALE_BUY_DRIVEN:  1.5  # confirmed buy-side wash (price inflation)
    WASH_SALE_VOLUME:      1.0  # high volume, direction unknown
    WASH_SALE_SELL_DRIVEN: 0.5  # sell-side wash (Wyckoff spring candidate; lower severity)
    ORDER_BOOK_IMBALANCE:  1.0  # one-sided order book
    VWAP_DEV:              0.5  # mild VWAP drift (normal for VN small-caps)
  block_weighted_threshold: 3.0  # weighted_sum >= 3.0 → BLOCK  (≈ 3 medium flags or 1 severe + 1 medium)
  warn_weighted_threshold:  0.5  # weighted_sum >= 0.5 → WARN   (any single flag still warns)

# ── Whale / Large Money Flow ──────────────────────────────────────────────────
whale:
  # [C3 FIX] threshold bằng notional value, không phải số cổ
  # Nếu không có tick data, dùng proxy_whale_net_from_daily()
  whale_tick_threshold_notional:  500_000_000  # 500 triệu VND/tick default
  whale_notional_thresholds:
    large_cap:   500_000_000   # 500 triệu VND/tick — VCB, HPG, BID...
    mid_cap:     200_000_000   # 200 triệu VND/tick — FPT, MWG...
    small_cap:   100_000_000   # 100 triệu VND/tick — các mã còn lại

  mcvd_lookback_days:   20
  mcvd_flat_threshold:  0.01   # |slope_normalized| < 0.01 → FLAT
  stealth_max_atr_pct:  0.015  # Giá hẹp: ATR/Price < 1.5%
  stealth_obv_min_chg:  0.03   # OBV tăng >= 3%
  stealth_z_vol_max:    1.5    # Z_vol < 1.5 (no spike)
  # [VN-FIX VN-B2] Proxy whale detection gate — z-score min for volume anomaly.
  # Raised further for VN noise reduction so ordinary rotation days are less likely to look like whale activity.
  proxy_z_vol_min:      1.8

# ── Proxy Data Quality (4.3 FIX) ─────────────────────────────────────────────
proxy_confidence_penalty:
  PROXY_OHLCV:     1      # HIGH→MEDIUM, MEDIUM→LOW
  PARTIAL_PROXY:   0.5    # MEDIUM→LOW nếu ≥ 2 components là proxy
  TICK_REAL:       0      # No penalty

proxy_data_quality_grade:
  TICK_REAL:       "A"
  PARTIAL_PROXY:   "B"
  PROXY_OHLCV:     "C"

# ── Entry / Exit Params ───────────────────────────────────────────────────────
entry_exit:
  atr_sl_mult:     1.5    # SL = Entry - 1.5 × ATR14
  atr_tp1_mult:    4.0    # TP1 = Entry + 4 × ATR14
  atr_tp2_mult:    8.0    # TP2 = Entry + 8 × ATR14
  # [VN-FIX V3] ATO on HOSE ends 09:15; early momentum wave is 09:15–09:45.
  t25_window_open:  "09:15"
  t25_window_close: "10:00"
  atc_window_start: "14:43"

# ── Position Sizing ───────────────────────────────────────────────────────────
sizing:
  kelly_max_pct:   25.0   # Hard cap: max 25% of portfolio per position
  kelly_fraction:  0.3    # Fractional Kelly (use 30% of full Kelly)
  min_position_pct: 3.0   # Do not open position < 3% portfolio
  max_positions:   10     # Max concurrent open positions

# ── ATR-Based Position Sizing (Phase II) ─────────────────────────────────────
# Complementary to Kelly sizing. Uses fixed-risk-per-trade approach:
#   stop_distance = ATR14 × atr_mult
#   shares = (portfolio_value × risk_pct) / stop_distance
# AMF WARN → size × warn_size_multiplier; AMF BLOCK → 0 shares
position_sizing:
  risk_pct:             0.01   # 1% of portfolio risked per trade
  atr_mult:             2.0    # stop_distance = ATR14 × 2.0
  warn_size_multiplier: 0.50   # AMF WARN reduces size to 50%

# ── Backtesting ───────────────────────────────────────────────────────────────
backtest:
  commission_bps:   15    # 15 bps per side (0.15%)
  slippage_bps:     5     # 5 bps average slippage
  tax_sell_bps:     10    # 0.1% tax on sell (VN regulation)
  t2_settlement:    True  # T+2 settlement; cannot sell same day (speculative T+0 blocked)
  lock_san_prob:    0.02  # default (large-cap); overridden per liquidity tier below
  # [BUG-17 FIX] limit_down_pct: HOSE=7% (0.07), HNX=10% (0.10), UPCOM=15% (0.15).
  # Using a single HOSE default here; override per-ticker when exchange is known.
  limit_down_pct:   0.07  # HOSE ±7% circuit breaker
  # Tiered lock_san (limit-down) probability by 20-day avg daily volume
  # Small-caps experience lock_san 5–15× more frequently than large-caps.
  lock_san_by_liquidity:
    liquid:    0.01   # avg_vol_20d > 1_000_000 shares (VCB, HPG, BID, …)
    normal:    0.03   # avg_vol_20d  100_000 – 1_000_000 shares
    illiquid:  0.08   # avg_vol_20d <  100_000 shares (small-caps, penny stocks)
  margin_rate:      0.0   # Alpha = no margin
  walk_forward_is_days: 252   # In-sample: 1 year
  walk_forward_oos_days: 63   # Out-of-sample: 1 quarter

# ── Universe Filters ──────────────────────────────────────────────────────────
universe:
  min_price:        5_000    # VND
  max_price:        500_000  # VND
  min_avg_vol_20d:  100_000  # shares/day
  min_market_cap:   500_000_000_000   # 500 tỷ VND
  exchanges:        ["HOSE", "HNX"]

# ── CAN SLIM Thresholds ───────────────────────────────────────────────────────
canslim:
  eps_growth_min_pct:    25  # EPS growth >= 25% YoY
  revenue_growth_min_pct: 20
  rs_rating_min:         70  # Relative Strength rating
  institutional_support:  True

# ── Scanner ───────────────────────────────────────────────────────────────────
scanner:
  per_ticker_timeout_s: 60   # 3 API calls per ticker now (OHLCV + PT + FOL); was 25

# ── Sectors ───────────────────────────────────────────────────────────────────
sectors:
  mapping_file: "data/sector_map.json"
  inflow_threshold:   20    # sector inflow_score >= 20 → INFLOW
  outflow_threshold: -20    # sector inflow_score <= -20 → OUTFLOW

# ── Macro Regime Engine ───────────────────────────────────────────────────────
macro:
  sbv_usdvnd_ceiling:    26000   # SBV managed ceiling (VND per 1 USD)
  # Score bands → regime (with hysteresis ±10)
  accommodative_min:     15      # score >= +15 → ACCOMMODATIVE
  restrictive_max:      -15      # score <= -15 → RESTRICTIVE
  # Sizing multipliers per regime (applied to kelly_max_pct)
  sizing_accommodative:  1.00    # full Kelly in accommodative regime
  sizing_neutral:        0.65    # 65% Kelly when neutral
  sizing_restrictive:    0.32    # 32% Kelly when restrictive
  # Gate delta: additive offset on BUY SMS threshold
  gate_delta_accommodative: -5.0  # lower the bar (easier entry)
  gate_delta_neutral:        0.0
  gate_delta_restrictive:   10.0  # raise the bar (harder entry)
  # Data staleness: penalty 5 pts/day after grace_days
  staleness_grace_days:   3
  staleness_pts_per_day:  5
  staleness_cap_pts:     40

# ── Earnings / BCTC Risk ──────────────────────────────────────────────────────
earnings:
  caution_days_before:         14    # ≤14 days before pub → CAUTION
  high_risk_days_before:        5    # ≤5 days before pub → HIGH_RISK
  caution_stop_tightener:      0.80  # multiply trailing-stop ATR mult
  high_risk_stop_tightener:    0.60
  caution_gate_delta:           5.0  # raise SMS entry gate by 5 pts
  high_risk_gate_delta:        10.0  # raise SMS entry gate by 10 pts

# ── Fundamental Scoring ───────────────────────────────────────────────────────
fundamental:
  eps_growth_min_pct:      25.0  # net-income YoY growth threshold (CANSLIM C)
  revenue_growth_min_pct:  20.0  # revenue YoY growth threshold
  roe_min_pct:             15.0  # ROE threshold for profitability score
  fol_institutional_thr:   20.0  # FOL% assumed to reflect institutional interest
  # Blend weight for canslim_fundamental_override()
  real_data_weight:        0.70  # 70% real fundamental, 30% technical proxy
